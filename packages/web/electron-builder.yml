appId: com.weila.work
copyright: Weila
productName: 微喇企业管理台
asar: true
asarUnpack:
  - electron/preload.js
files:
  - dist
  - electron
  - package.json
  - "!node_modules"
  - "!**/node_modules/**"
directories:
  output: release/${version}
  buildResources: build
electronDownload:
  mirror: https://cdn.npmmirror.com/binaries/electron/
extraResources:
  - from: ../agent-deploy
    to: agent
    filter:
      - "agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".env*"
      - "tsconfig.json"
      - "node_modules/**"
extraMetadata:
  main: electron/main.cjs
mac:
  category: public.app-category.business
  target:
    - target: dir
      arch:
        - arm64
