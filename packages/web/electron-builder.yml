appId: com.weila.work
copyright: Weila
productName: 微喇企业管理台
asar: true
asarUnpack:
  - electron/preload.js
files:
  - dist
  - electron
  - package.json
  - "!node_modules"
  - "!**/node_modules/**"
directories:
  output: release/${version}
  buildResources: build
electronDownload:
  mirror: https://cdn.npmmirror.com/binaries/electron/
extraResources:
  - from: ../agent-deploy
    to: agent
    filter:
      - ".output/**"
      - "node_modules/**"
      - ".env*"
extraMetadata:
  main: electron/main.cjs
mac:
  category: public.app-category.business
  target:
    - target: dir
      arch:
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 微喇企业管理台
  uninstallDisplayName: 微喇企业管理台
  artifactName: WeilaWork-${version}-win-${arch}-setup.${ext}
