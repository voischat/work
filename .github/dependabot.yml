version: 2
# Dependencies are pinned through the pnpm catalog, and Dependabot cannot edit
# catalog entries. Routine version PRs were closed as unusable; security PRs
# still open through Dependabot alerts. Bump versions with `pnpm up` instead.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
