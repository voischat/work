name: Deploy

env:
  TURBO_TELEMETRY_DISABLED: '1'

on:
  workflow_run:
    workflows: [Gates]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - run: pnpm exec turbo run build --filter=@weilasdk/playground-vue3
      - run: pnpm run build:story
      - run: pnpm run docs:build
      - name: Deploy website
        working-directory: apps/website
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy playground
        working-directory: apps/playground-vue3
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy UI storybook
        working-directory: packages/ui
        run: pnpm exec void deploy --platform cloudflare --dir storybook-static --spa --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy docs
        working-directory: docs
        run: pnpm exec void deploy --platform cloudflare --dir .vitepress/dist --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
