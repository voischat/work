name: Gates

env:
  TURBO_TELEMETRY_DISABLED: '1'

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt:check
      - run: pnpm run manifests
      - run: pnpm knip
      - run: pnpm run lint:names
      - run: pnpm run lint:sdk
      - run: pnpm run lint:comments
      - run: pnpm run test:scripts

  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:sdk
      - run: pnpm run api:snapshot
      - run: pnpm run typecheck:sdk
      - run: pnpm run typecheck:tsc:sdk
      - run: pnpm run typecheck:parity
      - run: pnpm run typecheck:strict-budget
      - run: pnpm run test:sdk
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm -C packages/core exec playwright install --with-deps chromium
      - run: pnpm -C packages/core run test:dist
      - run: pnpm run build:story

  web-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:web
      - run: pnpm exec turbo run typecheck --filter=weila-work-web --filter=@weilasdk/playground-vue3
      - run: pnpm exec turbo run test --filter=weila-work-web -- --passWithNoTests

  web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=weila-work-web

  gates:
    needs: [static, sdk]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "gates passed"

  web:
    needs: [web-checks, web-build]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "web passed"
