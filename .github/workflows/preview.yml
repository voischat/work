name: Preview Release

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    # Fork PRs get a read-only token and cannot publish; skip them entirely.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --force --filter=@vois/weila-sdk-core --filter=@vois/weila-sdk-ui
      - run: pnpm exec pkg-pr-new publish --pnpm --previewVersion --peerDeps --packageManager=pnpm ./packages/core ./packages/ui
      - if: github.event_name == 'pull_request'
        run: pnpm run build:web
      - if: github.event_name == 'pull_request'
        id: enable_preview
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          account_id="$(jq -r .account_id apps/website/wrangler.jsonc)"
          response="$(curl --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/work-web/subdomain" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'Cloudflare-Workers-Script-Api-Date: 2025-08-01' \
            --data '{"enabled":true,"previews_enabled":true}')"
          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null
      - if: github.event_name == 'pull_request'
        id: web_preview
        continue-on-error: true
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee web-preview.log
          url="$(sed -n 's/^Version Preview Alias URL: //p' web-preview.log)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          [ -n "$url" ]
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_PREVIEW_URL: ${{ steps.web_preview.outputs.url }}
        run: |
          body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            '<!-- weila-website-preview -->' \
            '## 预览站点' \
            "${WEB_PREVIEW_URL:-网站预览未生成，见 Preview Release 日志。}" \
            "_commit: ${{ github.event.pull_request.head.sha }}_")"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq '.[] | select(.body | contains("<!-- weila-website-preview -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" > /dev/null
          fi
      - if: github.event_name == 'pull_request' && steps.web_preview.outputs.url == ''
        run: exit 1
