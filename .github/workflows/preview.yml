name: Preview Release

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    # Fork PRs get a read-only token and cannot publish; skip them entirely.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --force --filter=@vois/weila-sdk-core --filter=@vois/weila-sdk-ui
      - run: pnpm exec pkg-pr-new publish --pnpm --previewVersion --peerDeps --packageManager=pnpm ./packages/core ./packages/ui
