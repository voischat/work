minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@intlify/message-compiler@11.4.23'
  - '@intlify/shared@11.4.23'
  - '@cloudflare/workers-utils@0.57.0'
trustPolicy: no-downgrade
# pnpm 11 rejects these locked versions as trust downgrades on a clean install.
trustPolicyExclude:
  - tsrs@0.25.0-ts7.1.0-beta
  - '@oxc-resolver/binding-darwin-arm64@4.2.0'
  - '@oxc-resolver/binding-darwin-x64@4.2.0'
  - '@oxc-resolver/binding-linux-arm64-gnu@4.2.0'
  - '@oxc-resolver/binding-linux-x64-gnu@4.2.0'
  - '@oxc-resolver/binding-win32-arm64-msvc@4.2.0'
  - '@oxc-resolver/binding-win32-x64-msvc@4.2.0'
  - chokidar@4.0.3
shellEmulator: true
packages:
  - apps/*
  - packages/*
overrides:
  '@intlify/message-compiler': ^11.4.23
  '@wl/network': npm:@vois/weila-network@^0.0.7
  # Security floors for transitive runtime dependencies (Dependabot alerts; the
  # direct parents pin ranges that still resolve to vulnerable versions).
  '@intlify/shared': ^11.4.23
  '@intlify/core-base': ^11.4.23
  'lodash-es': ^4.18.1
  'source-map-js': ^1.2.2
  'postcss': ^8.5.23
  'defu': ^6.1.5
  'nanoid': ^6.0.2
  'browserslist': ^4.28.7
  'rollup': ^4.59.0
  # Same-major security floors for transitive dev/runtime dependencies.
  'tinypool@<2.1.2': 2.2.0
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'minimatch@3': 3.1.4
  'ajv@6': 6.15.0
  'h3@1': 1.15.9
  'picomatch@<2.3.2': 2.3.2
  'mdast-util-to-hast@13': 13.2.1
  'webpack@5': 5.104.1
  'js-yaml@4': 4.3.2
  'katex@<0.18.2': 0.18.2
  'esbuild@<0.28.1': 0.28.2
  'minimatch@>=9 <11.0.1': 11.0.1
  '@vue/server-renderer@<3.5.42': 3.5.42
  '@intlify/eslint-plugin-vue-i18n>glob': 14.0.2
  'js-beautify>glob': 14.0.2
allowBuilds:
