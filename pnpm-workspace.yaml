catalogs:
  # core compiles with the TypeScript 7 native compiler; vue-tsc and tsdown
  # still need the 6.x API, so the two majors live apart.
  native:
    tsrs: 0.25.0-ts7.1.0-beta
    typescript: ^7.0.2
  # The playground tracks vue-router 5 while the console stays on 4.
  playground:
    vue-router: ^5.0.4
  web:
    vue: 3.5.35
    vue-tsc: 3.1.1
