minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@intlify/message-compiler@11.4.23'
  - '@intlify/shared@11.4.23'
  - '@tanstack/eslint-plugin-query@5.108.1'

trustPolicy: no-downgrade
# pnpm 11 rejects these locked versions as trust downgrades on a clean install.
trustPolicyExclude:
  - '@oxc-resolver/binding-darwin-arm64@4.2.0'
  - '@oxc-resolver/binding-darwin-x64@4.2.0'
  - '@oxc-resolver/binding-linux-arm64-gnu@4.2.0'
  - '@oxc-resolver/binding-linux-x64-gnu@4.2.0'
  - '@oxc-resolver/binding-win32-arm64-msvc@4.2.0'
  - '@oxc-resolver/binding-win32-x64-msvc@4.2.0'
  - chokidar@4.0.3

shellEmulator: true

packages:
  - packages/*

overrides:
  '@intlify/message-compiler': ^11.4.23
  '@wl/network': npm:@vois/weila-network@^0.0.7
  vite: npm:rolldown-vite@latest

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: true
  simple-git-hooks: true
  vue-demi: true

